<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faunadex Arena</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .arena {
            background-color: #16213e;
            padding: 30px;
            border-radius: 15px;

            display: grid;
            grid-template-columns: 150px 450px 150px;
            gap: 40px;
        }

        .mao-aliado,
        .mao-inimigo {
            display: grid;
            grid-template-rows: repeat(5, 120px);
            gap: 15px;
        }

        .carta {
            background-color: #0f3460;
            border: 2px dashed #4CAF50;
            border-radius: 8px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: bold;
        }

        .inimigo {
            border-color: #e94560;
            color: #e94560;
        }

        .tabuleiro {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 140px);
            gap: 10px;

            background-color: #0d1b2a;
            border: 3px solid #e94560;
            border-radius: 10px;
            padding: 15px;
        }

        .slot {
            background-color: #1b263b;
            border: 1px solid #415a77;
            border-radius: 5px;

            display: flex;
            justify-content: center;
            align-items: center;

            transition: 0.3s;
        }

        .slot:hover {
            background-color: #4CAF50;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="arena">

        <div class="mao-aliado">
            <div class="carta">Carta 1</div>
            <div class="carta">Carta 2</div>
            <div class="carta">Carta 3</div>
            <div class="carta">Carta 4</div>
            <div class="carta">Carta 5</div>
        </div>

        <div class="tabuleiro">
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
        </div>

        <div class="mao-inimigo">
            <div class="carta inimigo">Inimigo 1</div>
            <div class="carta inimigo">Inimigo 2</div>
            <div class="carta inimigo">Inimigo 3</div>
            <div class="carta inimigo">Inimigo 4</div>
            <div class="carta inimigo">Inimigo 5</div>
        </div>

    </div>

</body>
</html>
